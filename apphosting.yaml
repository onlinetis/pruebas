# apphosting.yaml
#
# Configuración esencial para el despliegue de una aplicación web (target: web)
# usando Firebase App Hosting.

service:
  # 'target: web' le indica a App Hosting que use el proceso llamado 'web'
  # definido en tu archivo Procfile.
  target: web

  # Configuración de puertos. El servicio recibirá tráfico en el puerto 8080
  # y se lo reenviará al puerto interno 8080, donde debe estar escuchando Gunicorn.
  ports:
    - port: 8080
      target: 8080
      handler: http

# Puedes añadir una sección 'resources' si necesitas más CPU, memoria o disco.
# resources:
#   cpu_cores: 1
#   memory_gb: 0.5
